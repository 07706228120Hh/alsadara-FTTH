name: agents_app
description: تطبيق الوكلاء (Aluklaa) — منتج مستقل
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  platform_core:
    path: ../packages/platform_core
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  webview_windows: ^0.4.0        # مستكشف SAS: متصفّح مدمج (WebView2) لالتقاط طلبات لوحة SAS

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# أيقونات الهاتف: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../branding/aluklaa_icon_1024.png"
  remove_alpha_ios: true
  background_color_ios: "#D97706"
