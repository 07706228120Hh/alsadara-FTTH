name: platform_core
description: الحزمة المشتركة لتطبيقات منصة العراق الرقمية — عميل API، الجلسة، نظام التصميم الموحّد، الودجات، شاشات الدخول والتذاكر
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3
  phosphor_flutter: ^2.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # الخطوط مضمّنة محلياً (بلا جلب من الإنترنت وقت التشغيل) — رخصة OFL في fonts/LICENSE-OFL.txt
  # تُستخدم من التطبيقات بـ: fontFamily: 'packages/platform_core/IBMPlexSansArabic'
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-Bold.ttf
          weight: 700
