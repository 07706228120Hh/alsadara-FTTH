<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sadara City 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0A1430;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
#label{position:fixed;left:0;top:0;pointer-events:none;padding:7px 14px;border-radius:999px;background:rgba(11,27,63,.88);border:1px solid #E6C67A;color:#F3DFA6;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#label.on{opacity:1}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.82);font-size:12.5px;font-weight:600;backdrop-filter:blur(10px);transition:opacity .3s;white-space:nowrap}
#hint.off{opacity:0}
#info{position:fixed;top:24px;left:24px;width:300px;padding:18px;border-radius:22px;background:linear-gradient(160deg,rgba(19,42,94,.86),rgba(11,27,63,.92));border:1px solid rgba(230,198,122,.55);color:#fff;backdrop-filter:blur(16px);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
#info.on{opacity:1;transform:none;pointer-events:auto}
#info .n{font-size:18px;font-weight:800;color:#F3DFA6}
#info .t{font-size:12.5px;color:rgba(255,255,255,.65);font-weight:600;margin-top:2px}
#info .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#info .g div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
#info .g b{display:block;font-size:20px;font-weight:800}
#info .g span{font-size:11.5px;color:rgba(255,255,255,.6);font-weight:600}
#info .on{color:#69F0AE}
#info .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
#info .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A44C,#69F0AE)}
#info .demo{margin-top:8px;font-size:11px;color:rgba(255,255,255,.45)}
#close{all:unset;cursor:pointer;position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(230,198,122,.4);color:#F3DFA6;font-size:18px}
@media (max-width:640px){#info{top:auto;bottom:16px;left:16px;right:16px;width:auto}#hint{display:none}}
</style></head><body>
<canvas id="c" aria-label="مدينة ثلاثية الأبعاد تفاعلية"></canvas>
<div id="label"></div>
<div id="hint">اسحب للتدوير · العجلة للتكبير · اضغط على مبنى للدخول لتفاصيله</div>
<div id="info" role="dialog" aria-label="تفاصيل المبنى"><button id="close" aria-label="إغلاق">✕</button>
<div class="n"></div><div class="t"></div>
<div class="g"><div><b class="subs"></b><span>مشترك</span></div><div><b class="on"></b><span>متصل الآن</span></div><div><b class="rx" dir="ltr" style="text-align:right"></b><span>الإشارة الضوئية dBm</span></div><div><b class="fat"></b><span>صندوق التوزيع</span></div></div>
<div class="bar"><i></i></div><div class="demo">بيانات توضيحية — تُربط لاحقاً بالبيانات الفعلية</div></div>
<script>/*SD_CONFIG*/</script>
<script>__BUNDLE__</script>
</body></html>
