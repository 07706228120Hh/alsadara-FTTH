<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول — الهاتف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.press{transition:transform .14s ease, box-shadow .14s ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:translateY(5px)}
.fld{transition:box-shadow .15s ease}
.fld:focus-within{box-shadow:inset 0 2px 0 rgba(15,22,96,.06), 0 0 0 3px rgba(0,172,193,.35), 0 3px 0 #C9CFE3 !important}
.fld input{all:unset;flex:1;min-width:0;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;color:#1B1E2B;direction:ltr;text-align:right}
.fld input::placeholder{color:#8A90A2;font-weight:600}
.btn{all:unset;box-sizing:border-box;cursor:pointer}
.btn:focus-visible{outline:3px solid #4DD0E1;outline-offset:3px}
@keyframes spin3d{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(105,240,174,.55)}50%{box-shadow:0 0 0 6px rgba(105,240,174,0)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cube3d{position:relative;transform-style:preserve-3d;animation:spin3d 3.2s linear infinite}
.cube3d span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:visible}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
</style>
</helmet>

<div dir="rtl" style="width: 400px; height: 1100px; box-sizing: border-box; background: radial-gradient(70% 60% at 25% 40%, rgba(0,172,193,.22) 0%, rgba(0,172,193,0) 60%), radial-gradient(60% 60% at 85% 10%, rgba(92,107,192,.35) 0%, rgba(92,107,192,0) 60%), linear-gradient(160deg, #0B1033 0%, #141C5A 55%, #0A2A3A 100%); font-family: 'Cairo', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 12px; padding: 22px 20px 0">
    <span style="perspective: 200px"><span style="width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(145deg, #FFFFFF, #E3E7F5); box-shadow: 1px 1px 0 #9FA8DA, 2px 2px 0 #9FA8DA, 3px 3px 0 #7986CB, 4px 4px 0 #7986CB, 8px 10px 16px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; transform: rotateX(12deg) rotateY(14deg); font-size: 22px; font-weight: 900; color: #1A237E">ص</span></span>
    <div><div style="font-size: 20px; font-weight: 900; line-height: 1.15">منصة الصدارة</div><div style="font-size: 11.5px; font-weight: 700; color: #E8C26A">لإدارة شبكات الألياف والعمليات</div></div>
  </header>
  <div style="display: flex; justify-content: center; margin-top: 10px"><svg width="340" height="250" viewBox="0 0 340 250" role="img" aria-label="مشهد ثلاثي الأبعاد: برج ألياف ضوئية يغذّي مباني بإشارات متحركة ودرع أمان عائم"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#26C6DA" stop-opacity=".55"/><stop offset="1" stop-color="#26C6DA" stop-opacity="0"/></radialGradient><linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4DD0E1" stop-opacity=".55"/><stop offset="1" stop-color="#4DD0E1" stop-opacity="0"/></linearGradient></defs><ellipse cx="170.0" cy="207.0" rx="150.0" ry="60.0" fill="url(#glow)" opacity=".5"/><g ><polygon points="40.1,187.0 170.0,262.0 170.0,271.0 40.1,196.0" fill="#141C5A"/><polygon points="170.0,262.0 299.9,187.0 299.9,196.0 170.0,271.0" fill="#0E1546"/><polygon points="170.0,112.0 299.9,187.0 170.0,262.0 40.1,187.0" fill="#1E2A78"/></g><line x1="191.7" y1="124.5" x2="61.8" y2="199.5" stroke="#2C3A94" stroke-width="1"/><line x1="148.3" y1="124.5" x2="278.2" y2="199.5" stroke="#2C3A94" stroke-width="1"/><line x1="213.3" y1="137.0" x2="83.4" y2="212.0" stroke="#2C3A94" stroke-width="1"/><line x1="126.7" y1="137.0" x2="256.6" y2="212.0" stroke="#2C3A94" stroke-width="1"/><line x1="234.9" y1="149.5" x2="105.0" y2="224.5" stroke="#2C3A94" stroke-width="1"/><line x1="105.0" y1="149.5" x2="234.9" y2="224.5" stroke="#2C3A94" stroke-width="1"/><line x1="256.6" y1="162.0" x2="126.7" y2="237.0" stroke="#2C3A94" stroke-width="1"/><line x1="83.4" y1="162.0" x2="213.3" y2="237.0" stroke="#2C3A94" stroke-width="1"/><line x1="278.2" y1="174.5" x2="148.3" y2="249.5" stroke="#2C3A94" stroke-width="1"/><line x1="61.8" y1="174.5" x2="191.7" y2="249.5" stroke="#2C3A94" stroke-width="1"/><path d="M170.0,173.0 L258.3,194.0" stroke="#0E1546" stroke-width="2.5" stroke-linecap="round"/><path d="M170.0,173.0 L258.3,194.0" stroke="#4DD0E1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3.0 /></g><polygon points="263.1,178.2 266.6,180.2 266.6,184.2 263.1,182.2" fill="#FFE082" opacity=".85"/><polygon points="263.1,188.2 266.6,190.2 266.6,194.2 263.1,192.2" fill="#FFE082" opacity=".85"/><polygon points="270.7,173.8 274.2,175.8 274.2,179.8 270.7,177.8" fill="#FFE082" opacity=".85"/><polygon points="270.7,183.8 274.2,185.8 274.2,189.8 270.7,187.8" fill="#FFE082" opacity=".85"/><circle cx="258.3" cy="165.0" r="1.5" fill="#69F0AE"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><g ><polygon points="62.6,162.0 81.7,173.0 81.7,198.0 62.6,187.0" fill="#00897B"/><polygon points="81.7,173.0 100.7,162.0 100.7,187.0 81.7,198.0" fill="#00695C"/><polygon points="81.7,151.0 100.7,162.0 81.7,173.0 62.6,162.0" fill="#26A69A"/></g><polygon points="86.4,175.2 89.9,177.2 89.9,181.2 86.4,179.2" fill="#FFE082" opacity=".85"/><polygon points="86.4,185.2 89.9,187.2 89.9,191.2 86.4,189.2" fill="#FFE082" opacity=".85"/><polygon points="94.1,170.8 97.5,172.8 97.5,176.8 94.1,174.8" fill="#FFE082" opacity=".85"/><polygon points="94.1,180.8 97.5,182.8 97.5,186.8 94.1,184.8" fill="#FFE082" opacity=".85"/><circle cx="81.7" cy="162.0" r="1.5" fill="#69F0AE"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><g ><polygon points="184.7,186.5 203.8,197.5 203.8,232.5 184.7,221.5" fill="#3949AB"/><polygon points="203.8,197.5 222.8,186.5 222.8,221.5 203.8,232.5" fill="#283593"/><polygon points="203.8,175.5 222.8,186.5 203.8,197.5 184.7,186.5" fill="#5C6BC0"/></g><polygon points="208.5,199.8 212.0,201.8 212.0,205.8 208.5,203.8" fill="#FFE082" opacity=".85"/><polygon points="208.5,209.8 212.0,211.8 212.0,215.8 208.5,213.8" fill="#FFE082" opacity=".85"/><polygon points="208.5,219.8 212.0,221.8 212.0,225.8 208.5,223.8" fill="#FFE082" opacity=".85"/><polygon points="216.2,195.3 219.6,197.3 219.6,201.3 216.2,199.3" fill="#FFE082" opacity=".85"/><polygon points="216.2,205.3 219.6,207.3 219.6,211.3 216.2,209.3" fill="#FFE082" opacity=".85"/><polygon points="216.2,215.3 219.6,217.3 219.6,221.3 216.2,219.3" fill="#FFE082" opacity=".85"/><circle cx="203.8" cy="186.5" r="1.5" fill="#69F0AE"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><g ><polygon points="117.2,192.5 136.2,203.5 136.2,232.5 117.2,221.5" fill="#3949AB"/><polygon points="136.2,203.5 155.3,192.5 155.3,221.5 136.2,232.5" fill="#283593"/><polygon points="136.2,181.5 155.3,192.5 136.2,203.5 117.2,192.5" fill="#5C6BC0"/></g><polygon points="141.0,205.8 144.5,207.8 144.5,211.8 141.0,209.8" fill="#FFE082" opacity=".85"/><polygon points="141.0,215.8 144.5,217.8 144.5,221.8 141.0,219.8" fill="#FFE082" opacity=".85"/><polygon points="148.6,201.3 152.1,203.3 152.1,207.3 148.6,205.3" fill="#FFE082" opacity=".85"/><polygon points="148.6,211.3 152.1,213.3 152.1,217.3 148.6,215.3" fill="#FFE082" opacity=".85"/><circle cx="136.2" cy="192.5" r="1.5" fill="#69F0AE"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle><ellipse cx="170.0" cy="85.0" rx="18.0" ry="7.0" fill="#4DD0E1" opacity=".25"><animate attributeName="rx" values="15.0;22.0;15.0" dur="3s" repeatCount="indefinite"/></ellipse><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="3s" repeatCount="indefinite"/><g ><polygon points="146.6,26.5 170.0,40.0 170.0,67.0 146.6,53.5" fill="#E3E7F5"/><polygon points="170.0,40.0 193.4,26.5 193.4,53.5 170.0,67.0" fill="#C5CBE0"/><polygon points="170.0,13.0 193.4,26.5 170.0,40.0 146.6,26.5" fill="#FFFFFF"/></g><g transform="translate(181.7,46.8) skewY(-30) scale(0.45)"><path d="M0,-18 L14,-12 L14,0 C14,10 7,16 0,19 C-7,16 -14,10 -14,0 L-14,-12 Z" fill="#1A237E"/><path d="M-6,1 L-1,6 L7,-4" stroke="#4DD0E1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(158.3,46.8) skewY(30)"><text x="0" y="4.5" font-family="Cairo, sans-serif" font-weight="900" font-size="13.0" fill="#1A237E" text-anchor="middle" >ص</text></g></g><circle cx="85.0" cy="13.0" r="1.1" fill="#B2EBF2"><animate attributeName="opacity" values="0;1;0" dur="2.0s" repeatCount="indefinite"/></circle><circle cx="245.0" cy="-12.0" r="1.1" fill="#B2EBF2"><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="270.0" cy="63.0" r="1.1" fill="#B2EBF2"><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="65.0" cy="88.0" r="1.1" fill="#B2EBF2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="190.0" cy="-57.0" r="1.1" fill="#B2EBF2"><animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></circle></svg></div>
  <main style="padding: 0 16px 24px; margin-top: -26px; position: relative; z-index: 2">
<form onSubmit="{{noSubmit}}" aria-label="نموذج تسجيل الدخول" class="rise" style="position: relative; background: #FFFFFF; border-radius: 28px; padding: 22px 20px 20px; box-shadow: inset 0 1px 0 #FFFFFF, 0 10px 0 #C9CFE3, 0 12px 0 #8E97C2, 0 40px 60px -24px rgba(5,8,40,.75); display: flex; flex-direction: column; gap: 14px">
  <div aria-hidden="true" style="position: absolute; top: 0; right: 36px; left: 36px; height: 4px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, #00ACC1, #1A237E, #E8C26A)"></div>
  <div style="display: flex; align-items: center; gap: 14px">
    <span style="perspective: 260px; flex: none"><span style="width: 52px; height: 52px; border-radius: 15px; background: linear-gradient(145deg, #3949AB, #1A237E); box-shadow: 1px 1px 0 #0F1660, 2px 2px 0 #0F1660, 3px 3px 0 #0F1660, 4px 4px 0 #0F1660, 5px 5px 0 #0F1660, 10px 14px 18px rgba(15,22,96,.35); display: flex; align-items: center; justify-content: center; transform: rotateX(10deg) rotateY(-12deg)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="16" r="1.4" fill="#FFFFFF"></circle></svg>
    </span></span>
    <div style="flex: 1; min-width: 0">
      <h2 style="margin: 0; font-size: 20px; font-weight: 900; color: #1B1E2B; line-height: 1.25">مرحباً بعودتك</h2>
      <p style="margin: 0; font-size: 13px; color: #5B6070; font-weight: 600">سجّل الدخول لمتابعة عملك</p>
    </div>
    <span role="status" style="flex: none; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: #E8F5E9; color: #1B5E20; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 #C8E6C9">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #2E7D32; animation: pulse 1.8s infinite"></span>متصل
    </span>
  </div>

  <div role="radiogroup" aria-label="نوع الدخول" style="display: flex; padding: 5px; gap: 5px; background: #EEF0F7; border-radius: 16px; box-shadow: inset 0 2px 4px rgba(15,22,96,.10)">
    <button type="button" role="radio" aria-checked="{{isCo}}" onClick="{{setCo}}" class="btn press" style="{{segCo}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4"></path></svg>موظف شركة</button>
    <button type="button" role="radio" aria-checked="{{isAd}}" onClick="{{setAd}}" class="btn press" style="{{segAd}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"></path><path d="M9 12l2 2 4-4"></path></svg>مدير النظام</button>
  </div>

  <sc-if value="{{isCoB}}" hint-placeholder-val="{{true}}">
  <div style="position: relative">
    <span style="display: block; font-size: 12.5px; font-weight: 800; color: #5B6070; margin: 0 4px 6px">الشركة</span>
    <button type="button" aria-haspopup="listbox" aria-expanded="{{coOpenS}}" onClick="{{toggleCo}}" class="btn fld" style="width: 100%; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; background: #F6F7FB; border-radius: 16px; box-shadow: inset 0 2px 0 rgba(15,22,96,.06), 0 3px 0 #DCE0EC">
      <span style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: linear-gradient(145deg, #26C6DA, #00838F); box-shadow: 2px 3px 0 #005662; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14"></path></svg></span>
      <span style="flex: 1; text-align: right; font-size: 15px; font-weight: 800; color: #1B1E2B">{{coName}}</span>
      <span style="font-size: 12px; font-weight: 800; color: #8A90A2">{{coCode}}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A237E" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-if value="{{coOpen}}" hint-placeholder-val="{{false}}">
      <div role="listbox" style="position: absolute; z-index: 5; top: 92px; right: 0; left: 0; background: #FFFFFF; border-radius: 16px; padding: 6px; box-shadow: 0 6px 0 #DCE0EC, 0 24px 40px -12px rgba(15,22,96,.45)">
        <sc-for list="{{companies}}" as="c" hint-placeholder-count="3">
          <button type="button" role="option" aria-selected="{{c.sel}}" onClick="{{c.pick}}" class="btn" style="{{c.style}}"><span style="flex: 1">{{c.name}}</span><span style="font-size: 12px; color: #8A90A2">{{c.code}}</span></button>
        </sc-for>
      </div>
    </sc-if>
  </div>
  </sc-if>
  <sc-if value="{{isAdB}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FFF8E1; color: #7A4F01; font-size: 13px; font-weight: 700; box-shadow: 0 3px 0 #FFE082">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"></path></svg>
      دخول مدير النظام — يفتح لوحة الإدارة العليا
    </div>
  </sc-if>

  <label style="display: block">
    <span style="display: block; font-size: 12.5px; font-weight: 800; color: #5B6070; margin: 0 4px 6px">اسم المستخدم</span>
    <span class="fld" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; background: #F6F7FB; border-radius: 16px; box-shadow: inset 0 2px 0 rgba(15,22,96,.06), 0 3px 0 #DCE0EC">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A237E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <input type="text" autocomplete="username" placeholder="اسم المستخدم أو رقم الهاتف">
    </span>
  </label>

  <label style="display: block">
    <span style="display: block; font-size: 12.5px; font-weight: 800; color: #5B6070; margin: 0 4px 6px">كلمة المرور</span>
    <span class="fld" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 6px 0 14px; padding-right: 14px; background: #F6F7FB; border-radius: 16px; box-shadow: inset 0 2px 0 rgba(15,22,96,.06), 0 3px 0 #DCE0EC">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A237E" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <input type="{{pwType}}" autocomplete="current-password" placeholder="••••••••">
      <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" class="btn" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #5B6070">
        <sc-if value="{{pwHidden}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
        <sc-if value="{{pwShown}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.5-1.2"></path></svg></sc-if>
      </button>
    </span>
  </label>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <button type="button" role="switch" aria-checked="{{remS}}" onClick="{{toggleRem}}" class="btn" style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 800; color: #1B1E2B">
      <span style="{{remTrack}}"><span style="{{remKnob}}"></span></span>تذكرني
    </button>
    <span style="font-size: 12px; font-weight: 700; color: #8A90A2">اتصال مشفّر</span>
  </div>

  <div>
    <span style="display: block; font-size: 12px; font-weight: 800; color: #8A90A2; margin: 0 4px 8px">حسابات محفوظة على هذا الجهاز</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{saved}}" as="a" hint-placeholder-count="3">
        <button type="button" onClick="{{a.pick}}" aria-pressed="{{a.sel}}" class="btn press" style="{{a.style}}"><span style="{{a.av}}">{{a.ini}}</span>{{a.label}}</button>
      </sc-for>
    </div>
  </div>

  <button type="button" onClick="{{login}}" class="btn press" style="height: 60px; margin-top: 4px; border-radius: 18px; background: linear-gradient(180deg, #3040A8, #1A237E); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 900; box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 7px 0 #0F1660, 0 22px 30px -12px rgba(15,22,96,.75)">
    تسجيل الدخول
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
  </button>

  <button type="button" class="btn press" style="height: 52px; border-radius: 16px; background: #FFFFFF; color: #00695C; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14.5px; font-weight: 800; box-shadow: inset 0 0 0 1.5px #B2DFDB, 0 5px 0 #B2DFDB">
    <svg width="28" height="22" viewBox="0 0 28 22" aria-hidden="true"><polygon points="14,2 26,8 14,14 2,8" fill="#4DB6AC"></polygon><polygon points="2,8 14,14 14,20 2,14" fill="#00897B"></polygon><polygon points="14,14 26,8 26,14 14,20" fill="#00695C"></polygon><circle cx="9" cy="14" r="1.2" fill="#B9F6CA"></circle><circle cx="6" cy="12.4" r="1.2" fill="#B9F6CA"></circle><path d="M18 6V1M21 7.5V3" stroke="#00695C" stroke-width="1.6" stroke-linecap="round"></path></svg>
    إعداد الراوتر (أوفلاين)
  </button>

  <p style="margin: 2px 0 0; text-align: center; font-size: 11.5px; font-weight: 700; color: #8A90A2">الإصدار v2.4.8 · منصة الصدارة</p>

  <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
    <div role="status" aria-live="polite" style="position: absolute; inset: 0; z-index: 9; border-radius: 28px; background: radial-gradient(120% 90% at 50% 30%, #23308F 0%, #121A5C 60%, #0B1033 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #FFFFFF; padding: 24px">
      <div style="perspective: 600px; width: 96px; height: 96px; margin-bottom: 10px">
        <div class="cube3d" style="width: 96px; height: 96px"><span style="transform:rotateY(0deg) translateZ(48px);background:#FFFFFF;border:1px solid rgba(26,35,126,.15)"><svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#1A237E"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#4DD0E1" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="transform:rotateY(90deg) translateZ(48px);background:#E3E7F5;border:1px solid rgba(26,35,126,.15)"><svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#1A237E"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#4DD0E1" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="transform:rotateY(180deg) translateZ(48px);background:#FFFFFF;border:1px solid rgba(26,35,126,.15)"><svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#1A237E"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#4DD0E1" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="transform:rotateY(-90deg) translateZ(48px);background:#E3E7F5;border:1px solid rgba(26,35,126,.15)"><svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 5v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="#1A237E"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#4DD0E1" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="transform:rotateX(90deg) translateZ(48px);background:#B2EBF2;border:1px solid rgba(26,35,126,.15)"></span><span style="transform:rotateX(-90deg) translateZ(48px);background:#C5CBE0;border:1px solid rgba(26,35,126,.15)"></span></div>
      </div>
      <div style="width: 30px; height: 6px; margin-top: -14px; border-radius: 50%; background: rgba(77,208,225,.35); box-shadow: 0 0 30px 18px rgba(77,208,225,.22)"></div>
      <h3 style="margin: 0; font-size: 19px; font-weight: 900">{{loadTitle}}</h3>
      <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 800"><span style="{{st.dot}}"></span><span style="{{st.txt}}">{{st.label}}</span></div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</form></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'co', open: false, co: 0, pw: false, rem: true, acc: -1, step: 0 };
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state;
    const cos = [
      { name: 'شركة الصدارة للاتصالات', code: '101' },
      { name: 'فرع الشبكات الشمالي', code: '204' },
      { name: 'فرع الشبكات الجنوبي', code: '317' }
    ];
    const seg = (on) => 'flex: 1; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 900; ' +
      (on ? 'background: #FFFFFF; color: #1A237E; box-shadow: 0 3px 0 #C9CFE3, 0 8px 14px -8px rgba(15,22,96,.35);' : 'color: #5B6070;');
    const accs = ['حساب ١', 'حساب ٢', 'حساب ٣'];
    const steps = ['التحقق من البيانات', 'تحميل الصلاحيات', 'تحضير لوحة التحكم'];
    const go = () => {
      clearInterval(this.t);
      this.setState({ step: 1 });
      this.t = setInterval(() => {
        const n = this.state.step + 1;
        if (n > 4) { clearInterval(this.t); this.setState({ step: 0 }); return; }
        this.setState({ step: n });
      }, 950);
    };
    return {
      noSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      isCo: String(s.mode === 'co'), isAd: String(s.mode === 'ad'),
      isCoB: s.mode === 'co', isAdB: s.mode === 'ad',
      segCo: seg(s.mode === 'co'), segAd: seg(s.mode === 'ad'),
      setCo: () => this.setState({ mode: 'co' }), setAd: () => this.setState({ mode: 'ad', open: false }),
      toggleCo: () => this.setState({ open: !s.open }), coOpen: s.open, coOpenS: String(s.open),
      chev: 'transition: transform .2s; transform: rotate(' + (s.open ? 180 : 0) + 'deg)',
      coName: cos[s.co].name, coCode: cos[s.co].code,
      companies: cos.map((c, i) => ({ name: c.name, code: c.code, sel: String(i === s.co),
        pick: () => this.setState({ co: i, open: false }),
        style: 'width: 100%; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border-radius: 12px; font-size: 14px; font-weight: 800; ' + (i === s.co ? 'background: #E8EAF6; color: #1A237E;' : 'color: #1B1E2B;') })),
      pwType: s.pw ? 'text' : 'password', pwHidden: !s.pw, pwShown: s.pw, pwLabel: s.pw ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور',
      togglePw: () => this.setState({ pw: !s.pw }),
      remS: String(s.rem), toggleRem: () => this.setState({ rem: !s.rem }),
      remTrack: 'position: relative; width: 46px; height: 26px; border-radius: 999px; transition: background .2s; ' + (s.rem ? 'background: #00838F; box-shadow: inset 0 2px 3px rgba(0,0,0,.2);' : 'background: #D5D9E6; box-shadow: inset 0 2px 3px rgba(15,22,96,.15);'),
      remKnob: 'position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 0 rgba(15,22,96,.25); transition: right .2s; right: ' + (s.rem ? '23px' : '3px') + ';',
      saved: accs.map((a, i) => ({ label: a, ini: String(i + 1), sel: String(i === s.acc),
        pick: () => this.setState({ acc: i === s.acc ? -1 : i, mode: 'co', co: i % 3 }),
        av: 'width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #FFFFFF; background: ' + (i === s.acc ? '#00838F' : '#7986CB') + '; box-shadow: 1px 2px 0 ' + (i === s.acc ? '#005662' : '#3949AB') + ';',
        style: 'display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 14px; border-radius: 12px; font-size: 13px; font-weight: 800; ' + (i === s.acc ? 'background: #E0F7FA; color: #005662; box-shadow: inset 0 0 0 1.5px #4DD0E1, 0 3px 0 #80DEEA;' : 'background: #F6F7FB; color: #1B1E2B; box-shadow: 0 3px 0 #DCE0EC;') })),
      login: go,
      loading: s.step > 0,
      loadTitle: s.step >= 4 ? 'تم — أهلاً بك' : (s.mode === 'ad' ? 'دخول مدير النظام…' : 'جارٍ تسجيل الدخول…'),
      steps: steps.map((l, i) => {
        const done = s.step > i + 1, act = s.step === i + 1;
        return { label: l,
          dot: 'width: 14px; height: 14px; flex: none; border-radius: 50%; transition: all .3s; ' + (done ? 'background: #69F0AE; box-shadow: 0 0 12px #69F0AE;' : act ? 'background: #4DD0E1; box-shadow: 0 0 0 5px rgba(77,208,225,.25);' : 'background: rgba(255,255,255,.18);'),
          txt: 'color: ' + (done || act ? '#FFFFFF' : 'rgba(255,255,255,.45)') + ';' };
      })
    };
  }
}
</script>
